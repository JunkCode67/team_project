version: '3.8'

services:
  db:
    image: postgres:17
    container_name: tournament_db
    environment:
      POSTGRES_DB: tournament_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: TournamentPlatform.API/Dockerfile
    container_name: tournament_api
    ports:
      - "5058:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=tournament_platform;Username=postgres;Password=postgres123
      - Jwt__Secret=your-super-secret-key-min-32-characters!!
      - Jwt__Issuer=TournamentPlatform
      - Jwt__Audience=TournamentPlatform
      - Jwt__ExpiryMinutes=60
    depends_on:
      - db

volumes:
  postgres_data:
